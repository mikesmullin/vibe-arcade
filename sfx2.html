<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SFX·Lab — m.js sound effect generator</title>
<style>
  * { box-sizing: border-box }
  html, body { margin: 0; padding: 0 }
  body {
    background: #070b12;
    background-image:
      radial-gradient(900px 500px at 85% -10%, rgba(56, 89, 168, .25), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(124, 58, 237, .15), transparent 60%);
    color: #e2e8f0;
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .app { max-width: 1060px; margin: 0 auto; padding: 30px 20px 50px }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 20px }
  .logo { font-size: 26px; font-weight: 800; letter-spacing: .04em }
  .logo span { color: #22d3ee; font-weight: 600 }
  .tag { margin: 0; color: #64748b; font-size: 13px }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
  .wide { grid-column: 1 / -1 }
  .card {
    background: rgba(15, 23, 42, .72);
    border: 1px solid rgba(51, 65, 85, .6);
    border-radius: 14px;
    padding: 18px 18px 16px;
  }
  h2 {
    margin: 0 0 14px;
    font-size: 11px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase;
    color: #64748b;
  }
  /* wave selector */
  .wave-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px }
  .wave-btn {
    padding: 8px 4px; font-size: 12.5px; text-transform: capitalize;
    background: rgba(30, 41, 59, .7); color: #94a3b8;
    border: 1px solid rgba(51, 65, 85, .8); border-radius: 9px; cursor: pointer;
    transition: all .15s ease;
  }
  .wave-btn:hover { color: #e2e8f0 }
  .wave-btn.on {
    background: rgba(34, 211, 238, .12); color: #67e8f9;
    border-color: rgba(34, 211, 238, .55);
    box-shadow: 0 0 0 1px rgba(34, 211, 238, .2), 0 0 18px rgba(34, 211, 238, .12) inset;
  }
  /* segmented control */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 14px }
  .seg button {
    padding: 6px 4px; font-size: 12px;
    background: transparent; color: #94a3b8;
    border: 1px solid rgba(51, 65, 85, .8); border-radius: 8px; cursor: pointer;
  }
  .seg button.on { background: rgba(167, 139, 250, .12); color: #c4b5fd; border-color: rgba(167, 139, 250, .5) }
  .seg-label { color: #94a3b8; font-size: 12.5px; margin: 14px 0 6px }
  /* faders */
  .fader { display: block; margin: 12px 0 }
  .fader-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px }
  .fader-top span { color: #94a3b8; font-size: 12.5px }
  .fader-top b { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #e2e8f0 }
  input[type=range] { width: 100%; accent-color: #22d3ee; margin: 0; cursor: pointer }
  /* checkbox */
  .chk { display: inline-flex; align-items: center; gap: 8px; margin: 10px 0 4px; color: #94a3b8; font-size: 12.5px; cursor: pointer }
  .chk input { accent-color: #22d3ee }
  /* preview */
  .scope-wrap { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid rgba(51, 65, 85, .7); background: #0a101c }
  .scope-wrap canvas { display: block; width: 100%; height: auto }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #a78bfa; box-shadow: 0 0 8px #a78bfa }
  .scope-meta {
    display: flex; justify-content: space-between;
    color: #64748b; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    margin: 8px 2px 14px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
  .btn {
    padding: 9px 16px; font-size: 13px; font-weight: 600;
    color: #e2e8f0; background: rgba(30, 41, 59, .8);
    border: 1px solid rgba(71, 85, 105, .8); border-radius: 10px; cursor: pointer;
    transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .btn:hover { border-color: #64748b }
  .btn:active { transform: translateY(1px) }
  .btn.primary {
    background: linear-gradient(135deg, rgba(34, 211, 238, .2), rgba(167, 139, 250, .2));
    border-color: rgba(34, 211, 238, .5); color: #a5f3fc; min-width: 116px;
  }
  .btn.primary:hover { border-color: #22d3ee }
  .progress { height: 5px; border-radius: 3px; background: rgba(30, 41, 59, .9); overflow: hidden; margin-top: 14px }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, #22d3ee, #a78bfa); border-radius: 3px }
  /* presets */
  .preset-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
  .preset-btn {
    padding: 8px 12px; text-align: left; font-size: 13px;
    background: rgba(30, 41, 59, .55); color: #cbd5e1;
    border: 1px solid rgba(51, 65, 85, .7); border-radius: 9px; cursor: pointer;
    transition: all .13s ease;
  }
  .preset-btn:hover { border-color: #64748b; background: rgba(30, 41, 59, .9) }
  .preset-btn.on { background: rgba(34, 211, 238, .1); border-color: rgba(34, 211, 238, .5); color: #67e8f9 }
  .save-row { display: flex; gap: 8px; margin-top: 14px }
  .save-row input {
    flex: 1; padding: 9px 12px; font-size: 13px; color: #e2e8f0;
    background: rgba(2, 6, 23, .6); border: 1px solid rgba(51, 65, 85, .8); border-radius: 9px;
    outline: none; min-width: 0;
  }
  .save-row input:focus { border-color: rgba(34, 211, 238, .55) }
  .preset-row { display: grid; grid-template-columns: 1fr auto; gap: 6px }
  .icon-btn {
    padding: 8px 11px; font-size: 14px; line-height: 1;
    background: transparent; color: #64748b;
    border: 1px solid rgba(51, 65, 85, .7); border-radius: 9px; cursor: pointer;
  }
  .icon-btn:hover { color: #f87171; border-color: rgba(248, 113, 113, .5) }
  .hint { color: #475569; font-size: 12.5px; font-style: italic; margin-top: 12px }
  .toast {
    margin-top: 12px; padding: 8px 12px; font-size: 12.5px;
    color: #6ee7b7; background: rgba(16, 185, 129, .1);
    border: 1px solid rgba(16, 185, 129, .35); border-radius: 9px;
  }
  footer { margin-top: 18px; color: #475569; font-size: 12px; text-align: center }
  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr }
    .preset-list { grid-template-columns: 1fr }
  }
</style>
</head>
<body>
<div id="app"><p style="color:#64748b;padding:30px 20px">loading m.js…</p></div>

<script type="module">
try {
  const M = (await import('https://mikesmullin.github.io/m-js/dist/m.min.js')).default

  const SR = 44100
  const WAVES = ['sine', 'square', 'sawtooth', 'triangle']

  // slider (0–100) → Hz on a log scale
  const hz = (s, lo, hi) => lo * Math.pow(hi / lo, s / 100)
  const fmtHz = (v) => v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + ' kHz' : Math.round(v) + ' Hz'
  const ri = (a, b) => Math.round(a + Math.random() * (b - a))

  const PRESETS = [
    { name: 'Laser Zap',   wave: 'sawtooth', f0: 62, f1: 12, curve: 'exp', dur: 0.45, vol: 0.8,  att: 0.004, dec: 0.40, dist: 0.35, cut: 92,  sweep: 12, sweepOn: true,  lfoR: 0,   lfoD: 0,   noise: 0 },
    { name: 'Coin',        wave: 'sine',     f0: 66, f1: 80, curve: 'lin', dur: 0.18, vol: 0.8,  att: 0.002, dec: 0.35, dist: 0,    cut: 100, sweep: 0,  sweepOn: false, lfoR: 0,   lfoD: 0,   noise: 0 },
    { name: 'Explosion',   wave: 'sawtooth', f0: 28, f1: 4,  curve: 'exp', dur: 1.4,  vol: 0.9,  att: 0.01,  dec: 1.30, dist: 0.9,  cut: 60,  sweep: 4,  sweepOn: true,  lfoR: 0,   lfoD: 0,   noise: 0.85 },
    { name: 'Power-Up',    wave: 'square',   f0: 20, f1: 85, curve: 'exp', dur: 0.6,  vol: 0.7,  att: 0.005, dec: 0.50, dist: 0.4,  cut: 98,  sweep: 60, sweepOn: true,  lfoR: 0,   lfoD: 0,   noise: 0.1 },
    { name: 'Laser Bloop', wave: 'square',   f0: 55, f1: 40, curve: 'exp', dur: 0.25, vol: 0.7,  att: 0.003, dec: 0.20, dist: 0.2,  cut: 88,  sweep: 0,  sweepOn: false, lfoR: 0,   lfoD: 0,   noise: 0 },
    { name: 'Siren',       wave: 'square',   f0: 52, f1: 40, curve: 'lin', dur: 1.2,  vol: 0.7,  att: 0.01,  dec: 1.00, dist: 0.15, cut: 90,  sweep: 0,  sweepOn: false, lfoR: 9,   lfoD: 0.6, noise: 0 },
    { name: 'Whoosh',      wave: 'sine',     f0: 30, f1: 18, curve: 'exp', dur: 0.9,  vol: 0.8,  att: 0.15,  dec: 0.70, dist: 0,    cut: 45,  sweep: 18, sweepOn: true,  lfoR: 0,   lfoD: 0,   noise: 0.9 },
    { name: 'Alarm',       wave: 'square',   f0: 68, f1: 68, curve: 'lin', dur: 1.0,  vol: 0.7,  att: 0.005, dec: 0.90, dist: 0.2,  cut: 95,  sweep: 0,  sweepOn: false, lfoR: 4,   lfoD: 0.9, noise: 0 },
  ]

  // ---- pure DSP: render params → Float32Array (no WebAudio, deterministic) ----
  function synth(p) {
    const n = Math.max(8, Math.floor(Math.max(0.02, p.dur) * SR))
    const out = new Float32Array(n)
    const f0 = hz(p.f0, 30, 20000)
    const f1 = hz(p.f1, 30, 20000)
    const cut0 = hz(p.cut, 40, 20000)
    const cutRatio = p.sweepOn ? Math.max(hz(p.sweep, 40, 20000) / cut0, 1e-6) : 1
    const kEnv = Math.log(1000) / Math.max(p.dec, 1e-3)
    const hasNoise = p.noise > 0.001
    const hasLfo = p.lfoR > 0 && p.lfoD > 0
    const hasDist = p.dist > 0.001
    const distAmp = 1 + p.dist * 30
    const twoPi = Math.PI * 2
    let phase = 0, y = 0
    for (let i = 0; i < n; i++) {
      const t = i / SR
      const pr = i / (n - 1)
      let f = p.curve === 'exp'
        ? f0 * Math.pow(Math.max(f1 / f0, 1e-6), pr)
        : f0 + (f1 - f0) * pr
      if (hasLfo) f *= 1 + p.lfoD * 0.5 * Math.sin(twoPi * p.lfoR * t)
      phase += f / SR
      const ph = phase - Math.floor(phase)
      let s
      switch (p.wave) {
        case 'sine':     s = Math.sin(twoPi * ph); break
        case 'square':   s = ph < 0.5 ? 1 : -1; break
        case 'sawtooth': s = 2 * ph - 1; break
        default:         s = 4 * (ph < 0.5 ? ph : 1 - ph) - 1
      }
      if (hasNoise) s = s * (1 - p.noise) + (Math.random() * 2 - 1) * p.noise
      if (hasDist) s = Math.tanh(s * distAmp)
      // one-pole lowpass with exponential cutoff sweep
      const alpha = 1 - Math.exp(-twoPi * cut0 * Math.pow(cutRatio, pr) / SR)
      y += alpha * (s - y)
      s = y
      // attack / exponential release envelope
      s *= t < p.att
        ? (p.att > 0.0001 ? t / p.att : 1)
        : Math.exp(-kEnv * (t - p.att))
      out[i] = s
    }
    // normalize peak to the chosen volume
    let peak = 0
    for (let i = 0; i < n; i++) { const a = Math.abs(out[i]); if (a > peak) peak = a }
    if (peak > 1e-9) {
      const g = p.vol / peak
      for (let i = 0; i < n; i++) out[i] *= g
    }
    return out
  }

  // ---- 16-bit PCM WAV encoder ----
  function encodeWAV(samples, sr) {
    const len = samples.length
    const buf = new ArrayBuffer(44 + len * 2)
    const v = new DataView(buf)
    const ws = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)) }
    ws(0, 'RIFF'); v.setUint32(4, 36 + len * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ')
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true)
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true)
    v.setUint16(32, 2, true); v.setUint16(34, 16, true)
    ws(36, 'data'); v.setUint32(40, len * 2, true)
    for (let i = 0; i < len; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]))
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true)
    }
    return new Blob([buf], { type: 'audio/wav' })
  }

  // ---- playback engine (plain object, lives outside the reactive scope) ----
  const engine = {
    ctx: null, src: null, raf: 0,
    ensure() {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)()
      if (this.ctx.state === 'suspended') this.ctx.resume()
      return this.ctx
    },
    stop() {
      if (this.raf) { cancelAnimationFrame(this.raf); this.raf = 0 }
      if (this.src) {
        const s = this.src; this.src = null
        s.onended = null
        try { s.stop() } catch (e) {}
      }
    },
    play(samples, sr, tick, done) {
      this.stop()
      const ctx = this.ensure()
      const buf = ctx.createBuffer(1, samples.length, sr)
      buf.getChannelData(0).set(samples)
      const src = ctx.createBufferSource()
      src.buffer = buf
      src.connect(ctx.destination)
      this.src = src
      const dur = samples.length / sr
      const t0 = ctx.currentTime + 0.02
      const loop = () => {
        if (this.src !== src) return
        const p = (ctx.currentTime - t0) / dur
        if (p >= 1) return
        if (p > 0) tick(p)
        this.raf = requestAnimationFrame(loop)
      }
      src.onended = () => { if (this.src === src) { this.stop(); done() } }
      src.start(t0)
      this.raf = requestAnimationFrame(loop)
    },
  }

  const appEl = document.getElementById('app')
  appEl.replaceChildren() // mount() diffs against an empty old-root; it never clears static children
  M.mount(appEl, () => {
    // non-reactive sinks. The x-effect writes to `samples` and never reads it,
    // so it can never retrigger itself. `scopeEl` is set by x-init on the
    // canvas: $refs is a directive magic, not a scope property, so a scope
    // method cannot read this.$refs — it silently throws and swallows.
    let samples = null
    let scopeEl = null
    const P0 = PRESETS[0]

    return {
      template: `
<div class="app" @keydown.space="spaceKey($event)">
  <header>
    <div class="logo">SFX<span>·LAB</span></div>
    <p class="tag">sound effect generator — every sound synthesized live in your browser</p>
  </header>

  <div class="grid">
    <section class="card">
      <h2>signal</h2>
      <div class="wave-row">
        <button type="button" class="wave-btn" x-for="w in waves" :key="w"
                :class="{ on: wave === w }" @click="wave = w" x-text="w"></button>
      </div>
      <label class="fader">
        <span class="fader-top"><span>start pitch</span><b x-text="hz0"></b></span>
        <input type="range" min="0" max="100" step="1" x-model.number="f0">
      </label>
      <label class="fader">
        <span class="fader-top"><span>end pitch</span><b x-text="hz1"></b></span>
        <input type="range" min="0" max="100" step="1" x-model.number="f1">
      </label>
      <div class="seg-label">glide curve</div>
      <div class="seg">
        <button type="button" :class="{ on: curve === 'exp' }" @click="curve = 'exp'">exponential</button>
        <button type="button" :class="{ on: curve === 'lin' }" @click="curve = 'lin'">linear</button>
      </div>
    </section>

    <section class="card">
      <h2>envelope &amp; fx</h2>
      <label class="fader">
        <span class="fader-top"><span>duration</span><b x-text="durLabel"></b></span>
        <input type="range" min="0.05" max="5" step="0.05" x-model.number="dur">
      </label>
      <label class="fader">
        <span class="fader-top"><span>volume</span><b x-text="(vol * 100) + '%'"></b></span>
        <input type="range" min="0" max="1" step="0.01" x-model.number="vol">
      </label>
      <label class="fader">
        <span class="fader-top"><span>attack</span><b x-text="att.toFixed(3) + ' s'"></b></span>
        <input type="range" min="0" max="0.3" step="0.001" x-model.number="att">
      </label>
      <label class="fader">
        <span class="fader-top"><span>decay</span><b x-text="dec.toFixed(2) + ' s'"></b></span>
        <input type="range" min="0.05" max="5" step="0.05" x-model.number="dec">
      </label>
      <label class="fader">
        <span class="fader-top"><span>distortion</span><b x-text="(dist * 100) + '%'"></b></span>
        <input type="range" min="0" max="1" step="0.01" x-model.number="dist">
      </label>
      <label class="fader">
        <span class="fader-top"><span>filter cutoff</span><b x-text="cutHz"></b></span>
        <input type="range" min="0" max="100" step="1" x-model.number="cut">
      </label>
      <label class="chk"><input type="checkbox" x-model="sweepOn"> sweep cutoff to end</label>
      <label class="fader" x-show="sweepOn">
        <span class="fader-top"><span>filter end</span><b x-text="sweepHz"></b></span>
        <input type="range" min="0" max="100" step="1" x-model.number="sweep">
      </label>
      <label class="fader">
        <span class="fader-top"><span>vibrato rate</span><b x-text="lfoR.toFixed(1) + ' Hz'"></b></span>
        <input type="range" min="0" max="30" step="0.5" x-model.number="lfoR">
      </label>
      <label class="fader">
        <span class="fader-top"><span>vibrato depth</span><b x-text="(lfoD * 100) + '%'"></b></span>
        <input type="range" min="0" max="1" step="0.01" x-model.number="lfoD">
      </label>
      <label class="fader">
        <span class="fader-top"><span>noise mix</span><b x-text="(noise * 100) + '%'"></b></span>
        <input type="range" min="0" max="1" step="0.01" x-model.number="noise">
      </label>
    </section>

    <section class="card wide" x-effect="render()">
      <h2>preview</h2>
      <div class="scope-wrap">
        <canvas x-ref="scope" x-init="captureScope($refs.scope)" width="720" height="180"></canvas>
        <div class="playhead" x-show="progress > 0" :style="{ left: (progress * 100) + '%' }"></div>
      </div>
      <div class="scope-meta">
        <span x-text="metaLabel"></span>
        <span x-text="durLabel"></span>
      </div>
      <div class="row">
        <button type="button" class="btn primary" @click="play()">
          <span x-text="playing ? '■  stop' : '▶  play'"></span>
        </button>
        <button type="button" class="btn" @click="download()">save .wav</button>
        <button type="button" class="btn" @click="randomize()">randomize</button>
        <span class="tag" style="margin-left:auto">space bar = play / stop</span>
      </div>
      <div class="progress"><div :style="{ width: (progress * 100) + '%' }"></div></div>
    </section>

    <section class="card wide">
      <h2>presets</h2>
      <div class="preset-list">
        <button type="button" class="preset-btn" x-for="p in presets" :key="p.name"
                :class="{ on: active === p.name }" @click="load(p)" x-text="p.name"></button>
      </div>
      <div class="save-row">
        <input type="text" x-model.trim="name" placeholder="name the current settings…"
               @keydown.enter="savePreset()">
        <button type="button" class="btn" @click="savePreset()">save preset</button>
      </div>
      <div class="hint" x-show="saved.length === 0">your saved presets will appear here</div>
      <div class="preset-list" x-show="saved.length > 0">
        <div class="preset-row" x-for="s in saved" :key="s.id">
          <button type="button" class="preset-btn" @click="load(s)" x-text="s.name"></button>
          <button type="button" class="icon-btn" title="delete" @click="removeSaved(s.id)">×</button>
        </div>
      </div>
      <div class="toast" x-show="toast" x-transition x-text="toast"></div>
    </section>
  </div>

  <footer>100% client-side synthesis · no audio files · built on m.js v3 — Alpine-style directives on a virtual DOM</footer>
</div>
      `,

      // ---- signal ----
      wave: P0.wave, f0: P0.f0, f1: P0.f1, curve: P0.curve,
      // ---- envelope & fx ----
      dur: P0.dur, vol: P0.vol, att: P0.att, dec: P0.dec,
      dist: P0.dist, cut: P0.cut, sweepOn: P0.sweepOn, sweep: P0.sweep,
      lfoR: P0.lfoR, lfoD: P0.lfoD, noise: P0.noise,
      // ---- ui ----
      waves: WAVES,
      presets: PRESETS,
      active: P0.name,
      name: '',
      saved: [],
      toast: '',
      playing: false,
      progress: 0,
      sampleCount: 0,
      _toastTimer: null,

      // ---- derived ----
      get hz0() { return fmtHz(hz(this.f0, 30, 20000)) },
      get hz1() { return fmtHz(hz(this.f1, 30, 20000)) },
      get cutHz() { return fmtHz(hz(this.cut, 40, 20000)) },
      get sweepHz() { return fmtHz(hz(this.sweep, 40, 20000)) },
      get durLabel() { return this.dur.toFixed(2) + ' s' },
      get metaLabel() {
        if (!this.sampleCount) return '—'
        const ms = Math.round(this.sampleCount / SR * 1000)
        return this.sampleCount.toLocaleString('en-US') + ' samples · ' + ms + ' ms'
      },

      // ---- actions ----
      // Runs on mount and whenever any knob the synth reads changes.
      // Reads params, writes a non-reactive sink + the canvas → no feedback loop.
      render() {
        samples = synth({
          wave: this.wave, curve: this.curve,
          f0: this.f0, f1: this.f1,
          dur: this.dur, vol: this.vol, att: this.att, dec: this.dec,
          dist: this.dist, cut: this.cut, sweep: this.sweep, sweepOn: this.sweepOn,
          lfoR: this.lfoR, lfoD: this.lfoD, noise: this.noise,
        })
        this.sampleCount = samples.length
        this.drawScope()
      },

      // x-init on the canvas runs after the ref registers, where $refs works.
      captureScope(el) { scopeEl = el },

      drawScope() {
        const el = scopeEl
        if (!el) {
          // first effect run can land before the canvas's x-init captured the
          // ref — retry once after the frame commits
          requestAnimationFrame(() => this.drawScope())
          return
        }
        const c = el.getContext('2d')
        const w = el.width, h = el.height
        c.clearRect(0, 0, w, h)
        c.strokeStyle = 'rgba(148,163,184,.18)'
        c.lineWidth = 1
        c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke()
        if (!samples || !samples.length) return
        const step = Math.max(1, Math.floor(samples.length / w))
        const tops = [], bots = []
        for (let x = 0; x < w; x++) {
          let mn = 0, mx = 0
          const a = x * step
          const b = Math.min(samples.length, a + step)
          for (let i = a; i < b; i++) {
            const s = samples[i]
            if (s < mn) mn = s
            if (s > mx) mx = s
          }
          tops.push(h / 2 + mx * (h / 2 - 6))
          bots.push(h / 2 + mn * (h / 2 - 6))
        }
        const grad = c.createLinearGradient(0, 0, w, 0)
        grad.addColorStop(0, '#22d3ee')
        grad.addColorStop(1, '#a78bfa')
        c.fillStyle = grad
        c.beginPath()
        c.moveTo(0, tops[0])
        for (let x = 1; x < w; x++) c.lineTo(x, tops[x])
        for (let x = w - 1; x >= 0; x--) c.lineTo(x, bots[x])
        c.closePath()
        c.fill()
      },

      play() {
        if (this.playing) { this.stopAll(); return }
        if (!samples || !samples.length) this.render()
        if (!samples) return
        this.playing = true
        this.progress = 0
        engine.play(samples, SR,
          (p) => { this.progress = p },
          () => { this.playing = false; this.progress = 0 },
        )
      },

      stopAll() {
        engine.stop()
        this.playing = false
        this.progress = 0
      },

      load(p) {
        this.stopAll()
        this.wave = p.wave; this.f0 = p.f0; this.f1 = p.f1; this.curve = p.curve
        this.dur = p.dur; this.vol = p.vol; this.att = p.att; this.dec = p.dec
        this.dist = p.dist; this.cut = p.cut; this.sweepOn = p.sweepOn; this.sweep = p.sweep
        this.lfoR = p.lfoR; this.lfoD = p.lfoD; this.noise = p.noise
        this.active = p.name
      },

      randomize() {
        this.stopAll()
        this.wave = WAVES[ri(0, WAVES.length - 1)]
        this.f0 = ri(15, 85)
        this.f1 = ri(4, 45)
        this.curve = Math.random() < 0.7 ? 'exp' : 'lin'
        this.dur = +(0.15 + Math.random() * 1.8).toFixed(2)
        this.vol = +(0.5 + Math.random() * 0.4).toFixed(2)
        this.att = +(0.002 + Math.random() * 0.06).toFixed(3)
        this.dec = +(0.2 + Math.random() * 1.2).toFixed(2)
        this.dist = Math.random() < 0.5 ? +(Math.random() * 0.8).toFixed(2) : 0
        this.cut = ri(40, 100)
        this.sweepOn = Math.random() < 0.55
        this.sweep = ri(3, 35)
        this.lfoR = Math.random() < 0.3 ? +(2 + Math.random() * 12).toFixed(1) : 0
        this.lfoD = this.lfoR > 0 ? +(0.1 + Math.random() * 0.7).toFixed(2) : 0
        this.noise = Math.random() < 0.4 ? +(Math.random() * 0.8).toFixed(2) : 0
        this.active = null
      },

      savePreset() {
        const n = (this.name || '').trim()
        if (!n) { this.flash('give the preset a name first'); return }
        this.saved.push({
          id: Date.now(), name: n,
          wave: this.wave, f0: this.f0, f1: this.f1, curve: this.curve,
          dur: this.dur, vol: this.vol, att: this.att, dec: this.dec,
          dist: this.dist, cut: this.cut, sweepOn: this.sweepOn, sweep: this.sweep,
          lfoR: this.lfoR, lfoD: this.lfoD, noise: this.noise,
        })
        this.name = ''
        this.flash('saved "' + n + '"')
      },

      removeSaved(id) {
        this.saved = this.saved.filter((s) => s.id !== id)
      },

      flash(msg) {
        this.toast = msg
        clearTimeout(this._toastTimer)
        this._toastTimer = setTimeout(() => { this.toast = '' }, 2200)
      },

      download() {
        if (!samples) this.render()
        if (!samples) return
        const blob = encodeWAV(samples, SR)
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = (((this.name || '').trim() || 'sfx').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.wav')
        document.body.appendChild(a)
        a.click()
        a.remove()
        setTimeout(() => URL.revokeObjectURL(url), 2000)
        this.flash('wrote ' + a.download)
      },

      spaceKey(e) {
        const t = e.target.tagName
        if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return
        e.preventDefault()
        this.play()
      },
    }
  })
} catch (err) {
  console.error(err)
  document.getElementById('app').innerHTML =
    '<p style="color:#f87171;padding:30px 20px">Could not load m.js from the CDN — check your network connection.</p>'
}
</script>
</body>
</html>
