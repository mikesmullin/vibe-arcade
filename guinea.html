<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guinea Pig Supplies — Pet Storefront</title>
<style>
  :root{--bg:#f8fafc;--card:#fff;--accent:#4ee2f5;--text:#0f172a;--muted:#64748b}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:10}
  header h1{margin:0;font-size:18px}
  .search{flex:1;max-width:420px}
  input,button,select{font:inherit}
  input[type=text]{width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
  .tag{background:var(--accent);color:#083344;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
  main{max-width:1100px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:1fr 320px;gap:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid #e2e8f0;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .card img{width:100%;height:140px;object-fit:cover;border-radius:8px;background:#e2e8f0}
  .card h3{margin:0;font-size:15px}
  .price{font-weight:700}
  .muted{color:var(--muted);font-size:13px}
  button{background:#0f172a;color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .cart{background:var(--card);border:1px solid #e2e8f0;border-radius:12px;padding:16px;position:sticky;top:84px;height:max-content}
  .cart h2{margin:0 0 12px;font-size:16px}
  .item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #e2e8f0}
  .item:last-child{border-bottom:0}
  .total{font-weight:700;margin-top:12px;padding-top:12px;border-top:1px solid #e2e8f0}
  [x-cloak]{display:none!important}
  @media(max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import M from 'https://mikesmullin.github.io/m-js/dist/m.min.js';

M.store('cart', {
  items: [],
  add(product){
    const existing = this.items.find(i => i.id === product.id);
    if (existing){ existing.qty++ } else { this.items.push({id: product.id, name: product.name, price: product.price, qty: 1}) }
  },
  remove(id){
    this.items = this.items.filter(i => i.id !== id);
  },
  inc(id){ const i = this.items.find(i => i.id === id); if (i) i.qty++ },
  dec(id){ const i = this.items.find(i => i.id === id); if (i){ i.qty--; if (i.qty <= 0) this.remove(id) } },
  count(){ return this.items.reduce((s,i)=>s+i.qty,0) },
  total(){ return this.items.reduce((s,i)=>s+i.qty*i.price,0).toFixed(2) }
});

M.mount('#app', () => ({
  template: `
    <header>
      <h1>🐹 Guinea Pig Supplies</h1>
      <div class="search">
        <input x-model="q" type="text" placeholder="Search hay, cage, treats…">
      </div>
      <button @click="showCart = !showCart">
        Cart <span class="tag" x-text="$store.cart.count()"></span>
      </button>
    </header>

    <main>
      <section>
        <div class="grid">
          <div class="card" x-for="p in products.filter(p => p.name.toLowerCase().includes(q.toLowerCase()))" :key="p.id">
            <img :src="p.img" :alt="p.name">
            <h3 x-text="p.name"></h3>
            <div class="muted" x-text="p.desc"></div>
            <div class="price" x-text="'$' + p.price"></div>
            <button @click="$store.cart.add(p)">Add to cart</button>
          </div>
        </div>
      </section>

      <aside class="cart" x-show="showCart">
        <h2>Shopping Cart</h2>
        <div x-show="$store.cart.items.length === 0" class="muted">Your cart is empty.</div>
        <div>
          <div class="item" x-for="i in $store.cart.items" :key="i.id">
            <div>
              <div x-text="i.name"></div>
              <div class="muted">$<span x-text="i.price"></span> × <span x-text="i.qty"></span></div>
            </div>
            <div>
              <button @click="$store.cart.dec(i.id)">−</button>
              <button @click="$store.cart.inc(i.id)">+</button>
              <button @click="$store.cart.remove(i.id)">✕</button>
            </div>
          </div>
        </div>
        <div class="total">
          Total: $<span x-text="$store.cart.total()"></span>
        </div>
        <button style="width:100%;margin-top:12px" :disabled="$store.cart.items.length === 0" @click="checkout()">Checkout</button>
      </aside>
    </main>
  `,
  q: '',
  showCart: true,
  checkout(){
    const cart = M.store('cart');
    if (cart.items.length === 0) return;
    alert('Checked out '+cart.count()+' items for $'+cart.total());
    cart.items = [];
  },
  products: [
    {id:1,name:'Timothy Hay 5lb',price:18.99,desc:'Premium grass hay for daily feeding',img:'https://picsum.photos/seed/hay/400/300'},
    {id:2,name:'Guinea Pig Pellets',price:12.49,desc:'Fortified with Vitamin C',img:'https://picsum.photos/seed/pellets/400/300'},
    {id:3,name:'Chew Wood Bundle',price:9.99,desc:'Safe teething sticks',img:'https://picsum.photos/seed/chew/400/300'},
    {id:4,name:'Water Bottle 250ml',price:7.99,desc:'No-drip sipper',img:'https://picsum.photos/seed/bottle/400/300'},
    {id:5,name:'Hideout Igloo',price:14.99,desc:'Cozy fleece hide',img:'https://picsum.photos/seed/igloo/400/300'},
    {id:6,name:'Vitamin C Tablets',price:6.49,desc:'50 tablets',img:'https://picsum.photos/seed/vitc/400/300'},
    {id:7,name:' fleece Bedding 2pk',price:22.00,desc:'Soft & washable',img:'https://picsum.photos/seed/bedding/400/300'},
    {id:8,name:'Cage Cleaning Spray',price:8.99,desc:'Enzyme cleaner',img:'https://picsum.photos/seed/clean/400/300'}
  ]
}));
</script>
</body>
</html>
