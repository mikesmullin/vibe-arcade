# assetgen manifest: list in, sprites out.  Run: .venv/bin/python run.py [asset ids]
project: diner_kitchen
out: out

comfy:
  model: flux-2-klein-4b.safetensors
  text_encoder: qwen_3_4b.safetensors
  vae: flux2-vae.safetensors
  steps: 4
  cfg: 1.0
  # Optional style LoRA trained with train.py. Off by default: with FLUX.2 klein the screenshot refs alone
  # give the cleanest results; v2 @ <=0.5 is stable but adds little, >=0.8 washes out / tints backgrounds.
  # lora: {name: dinerart_v2.safetensors, strength: 0.5, trigger: dnrart style}

style:
  # Reference images passed to every generation (style lock).  Comment out or use --no-refs to test without.
  refs:
    - refs/style_sheet.png
  ref_clause: >-
    Match the art style of the reference image exactly: the same glossy cel-shaded cartoon rendering,
    saturated diner palette, clean outlines and soft lighting from the upper left. Do not copy any object
    from the reference; draw a completely new image containing only the object described.
  # Per-asset overrides: template, state_template, bg ("pure white" default), cutout (rembg|key|none)
  # First state / plain props
  template: >-
    {ref_clause} A single isolated 2D game asset for a casual mobile cooking game: {object}.
    Bright saturated cel-shaded cartoon illustration with clean outlines and soft glossy highlights,
    seen from a 3/4 elevated angle, centered and filling most of the frame,
    on a plain flat {bg} background. No ground shadow, no scene, no table, no kitchen, no text, no UI.
  # Later states: the previous state image is appended as the last reference
  state_template: >-
    {ref_clause} Using the last reference image of the game asset, redraw the exact same object with the
    same shape, size, position, camera angle and art style, but change it to this state: {state}.
    Keep the plain flat {bg} background. No ground shadow, no scene, no text, no UI.

assets:
  - id: patty
    type: stateful
    prompt: a single thick round ground-beef burger patty by itself (only the meat, no bun, no bread, no plate, no lettuce), cartoon game food
    size: 1024
    seed: 42101
    chain: edit          # edit | img2img | none
    states:
      raw:     raw uncooked patty, red-pink minced meat with visible ground texture and small marbling flecks
      cooking: half-cooked patty, the outside turning light brown while the middle is still pink, faint grill marks, tiny steam
      cooked:  fully cooked patty, evenly deep golden-brown seared crust with dark charred grill lines, juicy
      burnt:   badly burnt patty, almost black charcoal crust, cracked and dry, with a wisp of grey smoke rising

  - id: bun_whole
    type: prop
    prompt: cartoon game food, a whole plain empty sesame hamburger bun (top and bottom halves stacked together, nothing in between, no patty, no cheese, no filling)
    size: 1024
    seed: 42204

  - id: bun_top
    type: prop
    prompt: >-
      cartoon game food, one single golden-brown dome-shaped dinner roll with sesame seeds on top, sitting alone with its flat
      base on the ground. It is one solid piece of bread with no layers, no second piece underneath, nothing stacked, no cut
    size: 1024
    seed: 42211

  - id: bun_bottom
    type: prop
    # klein fills the canvas we give it: a square frame + "thick cylinder / hockey puck" words made a TALL puck.
    # Short wide frame + no height trigger words -> a low wide base (same lesson as the cheese slice).
    prompt: >-
      cartoon game food, one single low wide round slice of golden bread, the flat base half of a hamburger bun:
      golden crust around the side, soft pale cream-colored crumb on the flat top face. It is much wider than it is tall,
      one solid piece, no layers, nothing stacked on top, no seeds
    size: [1024, 640]
    seed: 42223

