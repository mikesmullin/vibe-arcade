<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>m.js Todo</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0f172a; color:#f8fafc; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .app { width:520px; background:#1e293b; padding:24px; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,.3); }
  h1 { margin:0 0 16px; font-size:1.5rem; }
  .input-row { display:flex; gap:8px; margin-bottom:16px; }
  input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#f8fafc; font-size:1rem; }
  button { padding:10px 14px; border:none; border-radius:8px; background:#7c3aed; color:white; cursor:pointer; font-size:1rem; }
  button:hover { background:#8b5cf6; }
  .filters { display:flex; gap:8px; margin-bottom:12px; }
  .filters button { background:#334155; }
  .filters button.active { background:#10b981; }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; align-items:center; gap:10px; padding:10px; background:#0f172a; border-radius:8px; margin-bottom:8px; border:1px solid #334155; }
  li.completed span { text-decoration:line-through; opacity:.6; }
  li span { flex:1; }
  .tag { font-size:.8rem; padding:2px 6px; border-radius:4px; background:#334155; }
  .empty { text-align:center; opacity:.7; padding:24px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
  import M from 'https://mikesmullin.github.io/m-js/dist/m.min.js';

  M.mount('#app', () => ({
    template: `
      <div class="app">
        <h1>m.js Todo</h1>
        <div class="input-row">
          <input x-model="newTask" placeholder="What needs doing?" @keydown.enter="add">
          <button @click="add">Add</button>
        </div>
        <div class="filters">
          <button :class="filter === 'all' && 'active'" @click="filter = 'all'">All</button>
          <button :class="filter === 'active' && 'active'" @click="filter = 'active'">Active</button>
          <button :class="filter === 'done' && 'active'" @click="filter = 'done'">Done</button>
        </div>
        <div x-show="visible.length === 0" class="empty">No tasks — add one above</div>
        <ul>
          <li x-for="t in visible" :key="t.id" :class="t.done && 'completed'">
            <input type="checkbox" x-model="t.done">
            <span x-text="t.text"></span>
            <span class="tag" x-text="t.done ? 'done' : 'open'"></span>
            <button @click="remove(t.id)" style="background:#ef4444">×</button>
          </li>
        </ul>
        <div style="margin-top:12px; font-size:.85rem; opacity:.8">
          <span x-text="activeCount"></span> active · <span x-text="doneCount"></span> done
        </div>
      </div>
    `,
    tasks: [
      { id: 1, text: 'Read m-js docs', done: true },
      { id: 2, text: 'Build a todo SPA', done: false }
    ],
    newTask: '',
    filter: 'all',
    nextId: 3,
    add() {
      const v = this.newTask.trim();
      if (!v) return;
      this.tasks.push({ id: this.nextId++, text: v, done: false });
      this.newTask = '';
    },
    remove(id) {
      this.tasks = this.tasks.filter(t => t.id !== id);
    },
    get visible() {
      if (this.filter === 'active') return this.tasks.filter(t => !t.done);
      if (this.filter === 'done') return this.tasks.filter(t => t.done);
      return this.tasks;
    },
    get activeCount() { return this.tasks.filter(t => !t.done).length; },
    get doneCount() { return this.tasks.filter(t => t.done).length; }
  }));
</script>
</body>
</html>
