# CODE MANIFEST — what the game accepted and uses (code-owned).
# One entry per outbox id taken. Updated ONLY at formal accept time:
#   cp <art-outbox>/<id>/*.png assets/art/<id>/  (+ entry here + regen assets.json)
# Contract per entry: taken date, `from:` outbox source, files {game_key: path},
# keys wired in cook2.html. Generation details (prompts/seeds/cutout) stay art-side
# in the art manifest. See plan tmp/PARALLEL_PIPELINES.md §3b.
# `from:` paths are relative to the art outbox root (which lives next to the art
# manifest); the art dir name itself is omitted on purpose so the hard-rule check
# (grep the game for the art dir name — must be empty) stays green: the game never
# references art paths, it only copies bytes at accept time.
